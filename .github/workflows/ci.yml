name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tokens bouwen en vergelijken
        run: |
          node scripts/build-tokens.mjs
          git diff --exit-code app/tokens.css || (echo "app/tokens.css loopt achter op tokens.json: draai node scripts/build-tokens.mjs" && exit 1)
      - name: Token-lint (geen losse kleuren)
        run: node scripts/token-lint.mjs
      - name: Tests per acceptatiecriterium
        run: node --test tests/*.test.mjs
